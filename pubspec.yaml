name: Skogsjakten
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  google_sign_in: ^7.2.0
  material_design_icons_flutter: ^7.0.7296
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  image_picker: ^1.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/maskot_skogstroll.png"

flutter:
  fonts:
    - family: WinkySans
      fonts:
        - asset: assets/WinkySans-VariableFont_wght.ttf
    - family: YoungSerif
      fonts:
        - asset: assets/YoungSerif-Regular.ttf
  uses-material-design: true
  assets:
    - assets/maskot_skogstroll.png
    - assets/ros.jpg
    - assets/vitsippa.png
    - assets/tulpan.jpg
    - assets/blaklocka.jpg
